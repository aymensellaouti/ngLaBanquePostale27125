<p appRainbow [hidden]="isHidden">{{ name }} works!</p>
<button appRainbow class="btn btn-danger" (click)="showHide()">Show / Hide</button>
<input appRainbow #inputMessage type="text" class="form-control" (change)="setMessage(inputMessage.value)">
<p [in]="'green'" [out]="'blue'" appHighlight>Le contenu actuel de l'input est : {{ message }}</p>
<app-second/>
