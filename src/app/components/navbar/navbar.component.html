    </button>

      <div class="navbar-nav">
        <a
          class="nav-link active"

        <a
          class="nav-link"

        <a
          class="nav-link"
          [routerLink]="['word']"
          routerLinkActive="active text-primary"

        </a>
        <a
          class="nav-link"
          [routerLink]="['color']"
          routerLinkActive="active text-primary"
          >color
        </a>

          class="nav-link"
          [routerLink]="['login']"
          routerLinkActive="active text-primary"
          >Login
        </a>
        <a
